space: {{ isc_CustomerDemandFulfilmentSchemaSpace }}
externalId: CustomerLocation
name: CustomerLocation
description: Physical ship-to delivery point for a customer. One Customer can have many CustomerLocation nodes carrying site-level logistics and commercial details.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
    description: Identifier from the upstream source system.
  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created Time
    description: Timestamp when the node was created in the source system.
  sourceUpdatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated Time
    description: Timestamp when the node was last updated in the source system.
  sourceCreatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Created User
    description: User that created this node in the source system.
  sourceUpdatedUser:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Updated User
    description: User that last updated this node in the source system.
  siteCode:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Site Code
    description: Unique short code for this customer location in the source system, for example a ship-to party identifier.
  siteType:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Site Type
    description: Classification of the delivery location, for example Warehouse, Factory, RetailStore, or DistributionCentre.
  customer:
    type:
      list: false
      type: direct
    immutable: false
    # CDF requires direct-relation properties to be nullable. The mandatory
    # parent-child link is enforced at the application / transformation layer,
    # not via container-level nullability.
    nullable: true
    autoIncrement: false
    name: Customer
    description: Direct relation to the parent Customer master record. Every customer location must belong to a customer, enforced by transformation layer.
  geoLocation:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Geo Location
    description: Direct relation to the GeoLocations node representing this ship-to location in the geographic hierarchy.
  locationCity:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Location City
    description: City where this customer location is situated.
  locationRegion:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Location Region
    description: Region, state, province, or county where this location operates.
  physicalAddress:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Physical Address
    description: Full street address of the customer delivery location.
  latitude:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Latitude
    description: WGS84 latitude of this customer location.
  longitude:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Longitude
    description: WGS84 longitude of this customer location.
  contactName:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contact Name
    description: Primary receiving contact name at this location for delivery coordination.
  contactEmail:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contact Email
    description: Primary receiving contact email address at this location.
  contactPhone:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contact Phone
    description: Primary receiving contact phone number at this location.
  unloadingPoint:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Unloading Point
    description: Designated unloading point, dock, or receiving bay identifier for this location.
  receivingHours:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Receiving Hours
    description: Structured receiving window information used by delivery scheduling agents.
  deliveryPriority:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Delivery Priority
    description: Site-specific fulfilment priority override that takes precedence over the customer default when populated.
  paymentTerms:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Payment Terms
    description: Site-specific payment terms override for this delivery location.
  incoterms:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Incoterms
    description: Site-specific delivery terms override, for example EXW, FOB, or DAP.
  isHeadquarters:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Headquarters
    description: Whether this location is the customers primary or headquarters delivery address.
  isActive:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Active
    description: Whether this location is currently active for order fulfilment.
indexes:
  siteCode:
    properties:
    - siteCode
    cursorable: true
    indexType: btree
  siteType:
    properties:
    - siteType
    cursorable: true
    indexType: btree
  customer:
    properties:
    - customer
    cursorable: false
    indexType: btree
  geoLocation:
    properties:
    - geoLocation
    cursorable: false
    indexType: btree
  isActive:
    properties:
    - isActive
    cursorable: true
    indexType: btree
  isHeadquarters:
    properties:
    - isHeadquarters
    cursorable: true
    indexType: btree
  locationCity:
    properties:
    - locationCity
    cursorable: true
    indexType: btree
  deliveryPriority:
    properties:
    - deliveryPriority
    cursorable: true
    indexType: btree
usedFor: node