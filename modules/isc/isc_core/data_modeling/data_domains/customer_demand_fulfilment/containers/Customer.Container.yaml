  sourceContext:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source Context
    description: Source system or context for this node.
  sourceCreatedTime:
    type:
      list: false
      type: timestamp
    immutable: false
