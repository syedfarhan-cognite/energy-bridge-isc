  contactName:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contact Name
    description: Primary commercial contact name for order-related communications.
  contactEmail:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contact Email
    description: Primary commercial contact email used for order confirmation and allocation notifications.
  contactPhone:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Contact Phone
    description: Primary commercial contact phone number.
  parentCustomerId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Parent Customer ID
    description: Text identifier of the parent customer or corporate group entity for group-level reporting.
  parentCustomerDescription:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Parent Customer Description
    description: Human-readable name of the parent customer organisation.
  onTimeDeliveryRate:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: On-Time Delivery Rate
    description: Percentage of deliveries to this customer arriving on time.
  orderFillRate:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: Order Fill Rate
    description: Percentage of ordered quantity successfully fulfilled for this customer.
  isActive:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Is Active
    description: Whether this customer is currently active for order processing.
  geoLocation:
    type:
      list: false
      type: direct
    immutable: false
    nullable: true
    autoIncrement: false
    name: Geo Location
    description: Direct relation to the GeoLocations node representing the customers primary geographic location.
