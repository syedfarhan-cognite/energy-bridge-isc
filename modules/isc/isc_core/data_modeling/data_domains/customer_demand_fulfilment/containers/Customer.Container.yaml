space: {{ isc_CustomerDemandFulfilmentSchemaSpace }}
externalId: Customer
name: Customer
description: Central customer master record representing the sold-to commercial entity for downstream demand fulfilment. Site-level delivery locations are modelled separately in CustomerLocation.
properties:
  name:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Name
    description: Human-readable name for this node.
  description:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Description
    description: Human-readable description for this node.
  sourceId:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Source ID
