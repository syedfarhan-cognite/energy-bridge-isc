    description: Strategic importance tier used for allocation and service-level differentiation.
  paymentTerms:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Payment Terms
    description: Default payment terms for this customer, for example NET30 or COD.
  currency:
    type:
      list: false
      collation: ucs_basic
      type: text
    immutable: false
    nullable: true
    autoIncrement: false
    name: Currency
    description: Default transaction currency for this customer using an ISO 4217 code where available.
  incoterms:
    type:
      list: false
      collation: ucs_basic
      type: text
